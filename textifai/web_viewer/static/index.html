<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="doc-title">TextifAI Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">T</span>
          <div>
            <h1 id="brand-title">TextifAI Viewer</h1>
            <p id="brand-subtitle">Author knowledge workspace</p>
          </div>
        </div>
        <div class="toolbar">
            <button id="refresh-projects">Refresh</button>
        </div>
        <div id="project-list" class="project-list"></div>
      </aside>

      <main class="main">
        <header class="project-header">
          <div>
            <p id="current-project-eyebrow" class="eyebrow">Current project</p>
            <h2 id="project-title">Select project</h2>
            <p id="project-meta" class="muted">Read-only preview</p>
          </div>
          <nav class="tabs">
            <button id="tab-overview" data-view="overview" class="active">Overview</button>
            <button id="tab-notes" data-view="notes">Wiki</button>
            <button id="tab-canon" data-view="canon">Canon</button>
            <button id="tab-review" data-view="review">Review</button>
            <button id="tab-graph" data-view="graph">Graph</button>
            <button id="tab-artifacts" data-view="artifacts">Artifacts</button>
          </nav>
        </header>

        <section id="view-overview" class="view active"></section>
        <section id="view-notes" class="view split-view">
          <div class="panel">
            <h3 id="wiki-title">Wiki</h3>
            <p id="wiki-subtitle" class="muted">Read-only Markdown notes projected from VaERL.</p>
            <div class="wiki-filters">
              <input id="note-filter" class="search" placeholder="Search notes" />
              <select id="note-kind-filter"><option value="">All kinds</option></select>
              <select id="note-tag-filter"><option value="">All tags</option></select>
              <select id="note-status-filter"><option value="">All status</option></select>
            </div>
            <div id="note-list" class="list"></div>
          </div>
          <div class="panel detail">
            <div id="note-detail" class="note-detail muted">Select note.</div>
          </div>
        </section>
        <section id="view-canon" class="view"></section>
        <section id="view-review" class="view"></section>
        <section id="view-graph" class="view">
          <div class="graph-toolbar">
            <label><input type="checkbox" id="hide-system" checked /> <span id="label-hide-system">Hide system</span></label>
            <label><input type="checkbox" id="hide-review" /> <span id="label-hide-review">Hide review</span></label>
            <label><input type="checkbox" id="hide-chapters" checked /> <span id="label-hide-chapters">Hide chapters</span></label>
            <label><input type="checkbox" id="local-graph-mode" /> <span id="label-local-graph">Local graph</span></label>
            <select id="graph-kind-filter">
              <option value="">All kinds</option>
            </select>
            <select id="graph-status-filter">
              <option value="">All status</option>
            </select>
            <div class="graph-legend">
              <span class="legend-dot kind-character"></span> <span id="legend-character">character</span>
              <span class="legend-dot kind-place"></span> <span id="legend-place">place</span>
              <span class="legend-dot kind-event"></span> <span id="legend-event">event</span>
              <span class="legend-dot kind-object"></span> <span id="legend-object">object</span>
              <span class="legend-dot kind-concept"></span> <span id="legend-concept">concept</span>
              <span class="legend-dot kind-review"></span> <span id="legend-review">review</span>
            </div>
            <div class="graph-zoom-controls" aria-label="Graph zoom controls">
              <button id="graph-zoom-in" type="button">Zoom +</button>
              <button id="graph-zoom-out" type="button">Zoom -</button>
              <button id="graph-zoom-reset" type="button">Reset layout</button>
            </div>
            <div id="graph-tag-filter" class="graph-tag-filter" aria-label="Graph tag filters"></div>
          </div>
          <div class="graph-layout">
            <svg id="graph-svg" viewBox="0 0 1200 720"></svg>
            <div id="graph-detail" class="panel graph-detail muted">Select a node to inspect.</div>
          </div>
        </section>
        <section id="view-artifacts" class="view split-view">
          <div class="panel">
            <h3>System Artifacts</h3>
            <div id="artifact-list" class="list"></div>
          </div>
          <div class="panel detail">
            <pre id="artifact-detail" class="artifact-detail muted">Select an artifact.</pre>
          </div>
        </section>
      </main>
    </div>
    <script src="/app.js?v=graph-detail-tags-v3"></script>
  </body>
</html>
