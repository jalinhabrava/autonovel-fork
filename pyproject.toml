[project]
name = "textifai"
version = "0.1.0"
description = "TextifAI product runtime built on a fork of AutoNovel"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pypdf>=5.4.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
autonovel = "main:main"
textifai = "textifai.cli:main"
